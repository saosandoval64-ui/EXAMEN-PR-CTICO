{% extends "base.html" %}

{% block title %}Agregar libro · BiblioTech{% endblock %}

{% block content %}
<section class="page-head">
  <div class="page-head-text">
    <h1>Agregar libro</h1>
    <p>Registra un nuevo título en el catálogo.</p>
  </div>
</section>

<form class="book-form" method="post">
  <div class="field">
    <label for="titulo">Título</label>
    <input type="text" id="titulo" name="titulo" required maxlength="200" placeholder="Ej. Cien años de soledad" autofocus>
  </div>

  <div class="field">
    <label for="autor">Autor</label>
    <input type="text" id="autor" name="autor" required maxlength="200" placeholder="Ej. Gabriel García Márquez">
  </div>

  <div class="field-row">
    <div class="field">
      <label for="genero">Género</label>
      <input type="text" id="genero" name="genero" required maxlength="100" placeholder="Ej. Novela" list="generos-sugeridos">
      <datalist id="generos-sugeridos">
        <option value="Novela"></option>
        <option value="Ciencia ficción"></option>
        <option value="Fantasía"></option>
        <option value="Misterio"></option>
        <option value="Terror"></option>
        <option value="Biografía"></option>
        <option value="Historia"></option>
        <option value="Poesía"></option>
        <option value="Ensayo"></option>
        <option value="Infantil"></option>
      </datalist>
    </div>

    <div class="field">
      <label for="anio_publicacion">Año de publicación</label>
      <input type="number" id="anio_publicacion" name="anio_publicacion" required min="1000" max="3000" step="1" placeholder="Ej. 1967">
    </div>
  </div>

  <div class="form-actions">
    <button type="submit" class="btn btn--primary">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
      Guardar libro
    </button>
    <a class="btn btn--ghost" href="{{ url_for('web.index') }}">Cancelar</a>
  </div>
</form>
{% endblock %}
